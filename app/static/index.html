<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Upload a file and calculate its measurements.">
    <title>Geo-Metric</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Geo-Metric</a>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <h1 id="page-title">Upload your file</h1>
        <p>We’ll calculate its area and length.</p>
      </section>

      <section class="card" aria-labelledby="upload-title">
        <h2 id="upload-title">Select a file</h2>
        <form id="upload-form">
          <label class="drop-zone" id="drop-zone" for="file-input">
            <input id="file-input" name="file" type="file" accept=".kml,.zip" required>
            <span class="upload-icon" aria-hidden="true">↑</span>
            <strong>Drop your file here</strong>
            <span>or choose a file</span>
            <small>.kml or .zip · up to 4 MB</small>
          </label>

          <div class="file-row" id="file-row" hidden>
            <span class="file-type" id="file-type">KML</span>
            <span class="file-details">
              <strong id="file-name"></strong>
              <small id="file-size"></small>
            </span>
            <button class="remove" id="remove-file" type="button" aria-label="Remove selected file">×</button>
          </div>

          <button class="primary" id="submit-button" type="submit" disabled>Upload and measure</button>
        </form>

        <div class="status" id="status" role="status" aria-live="polite" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <div><strong>Working on your file</strong><small>This may take a moment.</small></div>
        </div>

        <div class="error" id="error" role="alert" hidden>
          <strong>Something went wrong</strong>
          <p id="error-message"></p>
        </div>
      </section>

      <section class="card results" id="results" aria-labelledby="results-title" hidden>
        <div class="results-heading">
          <h2 id="results-title">Your results</h2>
          <span class="complete">Done</span>
        </div>

        <div class="summary">
          <div><span>File</span><strong id="result-file"></strong></div>
          <div><span>Items</span><strong id="result-count"></strong></div>
        </div>

        <div class="table-wrap">
          <table>
            <thead><tr><th>Item</th><th>Measurement</th><th>Value</th><th>Result</th></tr></thead>
            <tbody id="measurement-rows"></tbody>
          </table>
        </div>
        <p class="result-note" id="result-note"></p>
        <button class="secondary" id="new-upload" type="button">Upload another file</button>
      </section>
    </main>

    <footer>Geo-Metric</footer>
  </body>
</html>
